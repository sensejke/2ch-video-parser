# Docker Compose для Windows
# Использование: docker-compose -f docker-compose.windows.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    # На Windows используем bind mounts вместо named volumes для лучшей производительности
    volumes:
      - ./videos.db:/app/videos.db
      - ./logs:/app/logs
      - ./cache:/app/cache
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - ENV=production
      # Windows специфичные переменные
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
    restart: unless-stopped
    # Увеличенные лимиты для Windows
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    command: sh -c "if [ \"$ENV\" = \"production\" ]; then gunicorn --bind 0.0.0.0:5000 --workers 2 --worker-class uvicorn.workers.UvicornWorker app:app; else python run_async.py; fi"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # Оптимизация для Windows
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Windows оптимизации
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
